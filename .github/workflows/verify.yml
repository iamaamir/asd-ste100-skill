name: Verify skill

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: |
          python -m py_compile skills/ste-technical-writing/scripts/*.py skills/ste-technical-writing/tests/*.py
      - name: Verify skill and run tests
        run: python skills/ste-technical-writing/scripts/verify_skill.py
      - name: Verify landing page SEO and internal links
        run: python3 scripts/verify_site.py
